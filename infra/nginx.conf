server {
    listen 80;
    server_name foodgram-inc.duckdns.org;
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name foodgram-inc.duckdns.org;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/foodgram-inc.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foodgram-inc.duckdns.org/privkey.pem;

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8888;
    }

    location /s/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8888;
    }

    location /admin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8888;
    }

    location /backend_static/ {
        alias /var/html/static/;
    }

    location /media/ {
        alias /var/html/media/;
    }

    location /api/docs/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/redoc.html;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
